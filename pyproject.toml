[project]
name = "ml-playground"
version = "0.1.0"
description = "Small machine-learning experiments, built up one at a time, starting with reinforcement learning"
readme = "README.md"
license = "MIT"
authors = [
    { name = "dave-finlay", email = "davefinlay+github@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control]>=1.4.0",
    "numpy>=2.5.4",
]

[tool.uv]
# Experiments are scripts in their own directories, not an installable package.
package = false
# Don't take package releases less than a week old: supply-chain attacks
# are usually caught and pulled within hours. To take an urgent fix
# sooner, allow just that package with --exclude-newer-package.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["cartpole/tests"]
# Tests import the experiment's modules the way its scripts do.
pythonpath = ["cartpole"]

[tool.ruff]
line-length = 88
# Experiment directories hold scripts that import each other's modules
# (e.g. cartpole/train.py imports cartpole/config.py), so treat modules
# there as first-party when sorting imports.
src = [".", "cartpole"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
